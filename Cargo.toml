[package]
name = "herdr-agent-context-labels"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compact task summaries and runtime status for Herdr coding-agent panes"

[lib]
name = "agent_context_labels"
path = "src/lib.rs"

[[bin]]
name = "herdr-agent-context-labels"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.1", features = ["json"] }

[dev-dependencies]
tempfile = "3.15"
